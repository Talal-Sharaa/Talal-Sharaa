name: Update README Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/readme-stats.yml"

permissions:
  contents: write

# Prevent two instances of this workflow from writing to main simultaneously.
concurrency:
  group: readme-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Required so we can safely rebase onto the latest main before pushing.
          fetch-depth: 0

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=blueberry&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=blueberry&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate WinAdvisor card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=WinAdvisor&theme=blueberry&hide_border=true
          path: profile/pin-winadvisor.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate MoviesWorkshop card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=MoviesWorkshop&theme=blueberry&hide_border=true
          path: profile/pin-moviesworkshop.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Moqat3a card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Moqat3a&theme=blueberry&hide_border=true
          path: profile/pin-moqat3a.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No stats changes to commit."
            exit 0
          fi

          git commit -m "chore: update README stats"

          # main may have advanced while the cards were being generated,
          # e.g. because WakaTime or another workflow updated the README.
          git pull --rebase origin main

          git push origin HEAD:main
